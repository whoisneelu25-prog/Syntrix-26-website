<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Badge -->
  <circle cx="32" cy="32" r="30" fill="#050816" stroke="#00f0ff" stroke-width="2" filter="url(#glow)" />
  <!-- Backpack / Oxygen Tank -->
  <rect x="14" y="24" width="8" height="20" rx="4" fill="#6d28d9" stroke="#8b5cf6" stroke-width="1.5" />
  <!-- Body -->
  <rect x="20" y="16" width="26" height="32" rx="13" fill="url(#suitGrad)" stroke="#00f0ff" stroke-width="2" />
  <!-- Visor -->
  <ellipse cx="36" cy="26" rx="11" ry="8" fill="url(#visorGrad)" stroke="#e0f2fe" stroke-width="1.5" />
  <!-- Visor Glint -->
  <ellipse cx="38" cy="24" rx="5" ry="2.5" fill="#ffffff" opacity="0.8" />
  <!-- Legs -->
  <rect x="23" y="44" width="8" height="12" rx="4" fill="#00e5ff" />
  <rect x="35" y="44" width="8" height="12" rx="4" fill="#7c3aed" />
</svg>